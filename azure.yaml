# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: foundry-harness-agent
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 50
  energy-brief-agent:
    host: azure.ai.agent
    metadata:
      tags:
        - Agent Framework
        - Harness Agent
        - Foundry Skills
        - Energy
    project: src/energy-brief-agent
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: energy-brief-agent
    description: Agent Framework Harness agent that pulls its energy-market skills from Foundry at startup and writes oil & gas market briefs.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME=gpt-5.4-mini}
      SKILL_NAMES: ${SKILL_NAMES=energy-market-brief,energy-news-digest}
    container:
      resources:
        cpu: '1'
        memory: 2Gi
infra:
  provider: microsoft.foundry
